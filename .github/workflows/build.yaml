name: Build dmenu

# Nobody pushes to a fork for months, so the weekly run is what catches a toolchain
# that stopped compiling it. Pushes to h3nc4 go through release.yaml, which builds
# the same way.
on:
  pull_request:
    branches:
      - "h3nc4"
  schedule:
    - cron: "31 5 * * 1" # Weekly, on Mondays
  workflow_dispatch:

jobs:
  # A job's container is chosen before any of its steps run, so reading the pin needs a job of
  # its own. .devcontainer.json is the only place this image is named.
  image:
    name: Read the pinned dev image
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.pin.outputs.ref }}
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Read .devcontainer.json
        id: pin
        run: echo "ref=$(./scripts/devcontainer-image.sh)" >>"${GITHUB_OUTPUT}"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: image
    container:
      image: ${{ needs.image.outputs.ref }}
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run the checks
        run: ./scripts/ci.sh

  deb:
    name: Build the Debian package
    runs-on: ubuntu-latest
    container:
      image: debian:trixie@sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6
    steps:
      - name: Install the packaging tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git make gcc libc6-dev \
            libx11-dev libxft-dev libxinerama-dev dpkg-dev
          git config --system --add safe.directory '*'
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build the package
        run: ./scripts/deb.sh
      - name: Run actions/upload-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: deb
          path: dmenu-h3nc4_*_amd64.deb
          if-no-files-found: error

  check-deb:
    name: Check the package on ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: deb
    strategy:
      matrix:
        image:
          - debian:trixie@sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6
          - devuan/devuan:excalibur@sha256:e0f3f31d6137c9dba7441c44b4a92b4dafe5f8978b9ff389224a8120cab03e55
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run actions/download-artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: deb
      - name: Run the package checks
        run: ./scripts/check-deb.sh
