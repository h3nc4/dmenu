name: Release dmenu

on:
  push:
    branches:
      - "h3nc4"
  workflow_dispatch:

jobs:
  # A job's container is chosen before any of its steps run, so reading the pin needs a job of
  # its own. .devcontainer.json is the only place this image is named.
  image:
    name: Read the pinned dev image
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.pin.outputs.ref }}
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Read .devcontainer.json
        id: pin
        run: echo "ref=$(./scripts/devcontainer-image.sh)" >>"${GITHUB_OUTPUT}"

  deb:
    name: Build the Debian package
    runs-on: ubuntu-latest
    container:
      image: debian:trixie@sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6
    steps:
      - name: Install the packaging tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git make gcc libc6-dev \
            libx11-dev libxft-dev libxinerama-dev dpkg-dev
          git config --system --add safe.directory '*'
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build the package
        run: ./scripts/deb.sh
      - name: Run actions/upload-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: deb
          path: dmenu-h3nc4_*_amd64.deb
          if-no-files-found: error

  release:
    name: Build and Release
    runs-on: ubuntu-latest
    needs: [image, deb]
    container:
      image: ${{ needs.image.outputs.ref }}
    permissions:
      contents: write # creates the tag and the release
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build the release artifact
        run: make dist.built
      - name: Run actions/download-artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: deb
      - name: Name the tag after the commit
        run: echo "SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-8)" >>"${GITHUB_ENV}"
      - name: Create the tag
        run: |
          git tag "${SHORT_SHA}"
          git push origin "${SHORT_SHA}"
      - name: Import the signing key
        run: echo "${GPG_PRIVATE_KEY}" | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      - name: Sign the artifact
        run: |
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "${GPG_PASSPHRASE}" \
            --detach-sign --armor -o dmenu.tar.gz.asc dmenu.tar.gz
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      - name: Sign the .deb
        run: |
          for deb in dmenu-h3nc4_*_amd64.deb; do
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase "${GPG_PASSPHRASE}" \
              --detach-sign --armor -o "${deb}.asc" "${deb}"
          done
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      - name: Run softprops/action-gh-release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: ${{ env.SHORT_SHA }}
          files: |
            dmenu.tar.gz.asc
            dmenu.tar.gz
            dmenu-h3nc4_*_amd64.deb.asc
            dmenu-h3nc4_*_amd64.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
